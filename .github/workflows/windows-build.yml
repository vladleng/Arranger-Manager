name: Windows Hub Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --target ArrangerManagerHub_VST3 ArrangementTagTests SongSnapshotTests --parallel 2
      - name: Test project reader and name parser
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/Arranger Manager 0.0g" | Out-Null
          Copy-Item -Recurse -Force "build/ArrangerManagerHub_artefacts/Release/VST3/Arranger Manager Hub.vst3" "package/Arranger Manager 0.0g"
          Copy-Item -Force "docs/HUB-0.0g.md" "package/Arranger Manager 0.0g"
      - uses: actions/upload-artifact@v4
        with:
          name: Arranger-Manager-Hub-0.0g-Windows
          path: package
