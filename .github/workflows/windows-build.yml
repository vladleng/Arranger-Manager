name: Windows Inspector Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --target ArrangerManagerInspector_VST3 ArrangerManagerHub_VST3 ArrangementTagTests --parallel 2
      - name: Test name parser
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/Arranger Manager 0.0d" | Out-Null
          Copy-Item -Recurse -Force "build/ArrangerManagerInspector_artefacts/Release/VST3/Arranger Manager Inspector.vst3" "package/Arranger Manager 0.0d"
          Copy-Item -Recurse -Force "build/ArrangerManagerHub_artefacts/Release/VST3/Arranger Manager Hub.vst3" "package/Arranger Manager 0.0d"
          Copy-Item -Force "docs/DOCK-TEST-0.0d.md" "package/Arranger Manager 0.0d"
      - uses: actions/upload-artifact@v4
        with:
          name: Arranger-Manager-0.0d-Windows
          path: package
